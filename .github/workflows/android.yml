name: Build APK Android

# Chạy khi đẩy code Android lên nhánh main, hoặc bấm tay ở tab Actions
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Chuẩn bị khoá ký APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vocab.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/vocab.jks" >> "$GITHUB_ENV"
            echo "Đã có khoá ký riêng."
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64, APK được ký tạm bằng khoá debug."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/VocabHandbook.apk"

      - name: Lưu APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VocabHandbook-apk
          path: ${{ runner.temp }}/VocabHandbook.apk

      - name: Đăng APK lên trang Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Vocab Handbook Android (bản mới nhất)
          body: |
            Bản build số ${{ github.run_number }}, commit ${{ github.sha }}.
            Mở trang này trên điện thoại Android, tải file VocabHandbook.apk bên dưới rồi bấm vào file để cài.
          files: ${{ runner.temp }}/VocabHandbook.apk
          make_latest: true
